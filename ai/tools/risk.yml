# Tool risk registry (DND-172 / gap 13)
#
# Classifies every harness tool by its WORST-CASE capability, so
# a downstream consumer (C2 / DND-173 phase gating) can decide whether a tool is
# allowed to run in a given phase. Classification is by TOOL, not by subcommand:
# a tool that CAN mutate external state is destructive even if the invocation at
# hand only reads.
#
# Classes, ordered least -> most restrictive:
#   readOnly     observes/analyzes; cannot mutate the repo, forge, tracker, or
#                remote in any invocation.
#   idempotent   mutates LOCAL state deterministically; re-running yields the
#                same result (no external/irreversible effect).
#   destructive  mutates external or otherwise irreversible state (forge /
#                tracker / remote), OR grants that capability to something else.
#
# Deny-by-default: `default` is the class assigned to any tool NOT listed here.
# It MUST stay `destructive` — an unclassified tool is treated as most
# restrictive until a human classifies it. `ai/bin/check-tool-risk` asserts both
# this and full coverage (every harness tool has an entry).
#
# A harness tool is a first-party executable that ai/lib/harness_tools.rb scopes
# in (DND-508): ai/bin/*, ai/skills/*/bin/*, ai/skills/*/scripts/*. An ai/bin
# tool is keyed by its bare name; any other by its path under ai/ (e.g.
# `skills/athena:slack/bin/post`), which is unique where basenames collide and
# is what workflow-phase-guard matches in a command.
#
# Each `tools` entry: `class` (one of `classes`, required) + `reason` (a
# one-word token naming why, required).

version: 1
default: destructive
classes:
  - readOnly
  - idempotent
  - destructive

tools:
  # --- readOnly: observe/analyze only (writes, if any, stay inside temp/self-test
  #     sandboxes; no repo/forge/tracker/remote mutation in any invocation) ---
  admiral-report-watch:    { class: readOnly, reason: watch }
  blast-radius:            { class: readOnly, reason: check }
  check-agent-size:        { class: readOnly, reason: check }
  # Executes each bin with --help, but under a refusing-stub PATH, a sandboxed
  # cwd/HOME, and a bounded timeout, and it FAILS any bin whose help path
  # writes to the repo or its cwd. Asserting the absence of side effects is
  # what it does; readOnly is the accurate class.
  check-bin-help:          { class: readOnly, reason: check }
  check-generic-skills:    { class: readOnly, reason: check }
  check-guard-messages:    { class: readOnly, reason: check }
  check-hooks-registered:  { class: readOnly, reason: check }
  check-inbox-registry:    { class: readOnly, reason: check }
  check-inotify-headroom:  { class: readOnly, reason: check }
  check-pipefail-grep:     { class: readOnly, reason: check }
  check-tool-risk:         { class: readOnly, reason: check }
  confirm-merged:          { class: readOnly, reason: query }
  critic-eval:             { class: readOnly, reason: eval }
  critic-review:           { class: readOnly, reason: review }
  contention-census:       { class: readOnly, reason: census }
  forge-preflight:         { class: readOnly, reason: probe }
  harness-signals:         { class: readOnly, reason: signals }
  lead-time:               { class: readOnly, reason: analysis }
  push-actor-check:        { class: readOnly, reason: query }
  ready-and-idle:          { class: readOnly, reason: analysis }

  # --- idempotent: deterministic local mutation (writes an in-repo artifact;
  #     re-running yields the same result; no external/irreversible effect) ---
  build-agents:            { class: idempotent, reason: render }
  # Kills only this uid's mock-athena-inbox-client.rb processes with no live
  # self-test.sh/fake-suite.sh ancestor anywhere in their process lineage
  # (unambiguous orphans by that measure -- a live parent that is not itself
  # running the suite does NOT spare one) -- local process state, never
  # repo/forge/tracker/remote, so idempotent (re-running once clean is a
  # no-op).
  check-inbox-mock-orphans: { class: idempotent, reason: reap }
  # admiral-eval / harness-eval can rewrite a TRACKED baseline JSON via
  # --update-baseline (and harness-eval writes ai/eval/scorecard.json on the
  # default gate path), so by worst-case capability they mutate the repo.
  admiral-eval:            { class: idempotent, reason: baseline }
  harness-eval:            { class: idempotent, reason: scorecard }
  # harness-gate's default (no-arg) path runs harness-eval bare, which writes
  # ai/eval/scorecard.json, so the gate transitively mutates the repo too.
  harness-gate:            { class: idempotent, reason: gate }
  # harness-metrics writes ai/telemetry/metrics.json on its default path.
  harness-metrics:         { class: idempotent, reason: metrics }
  # variant-eval is proposal-only (stdout by default; --out writes a proposal
  # file deterministically), runs corpora in throwaway detached worktrees, and
  # explicitly denies merge/commit/push/forge/--update-baseline — no external
  # or irreversible effect, so idempotent (never destructive).
  variant-eval:            { class: idempotent, reason: measure }
  # fleet-control (DND-443) READS a session's control state from the Athena
  # server (a GET) and writes only this machine's own control cache under
  # $XDG_STATE_HOME. It changes no external state.
  fleet-control:           { class: idempotent, reason: cache }
  # fleet-resume (DND-443) appends run-ownership marker lines to this machine's
  # own coordination state logs (untracked, gitignored). Local only.
  fleet-resume:            { class: idempotent, reason: markers }

  # --- destructive: external/irreversible, or grants that capability ---
  gh-athena:               { class: destructive, reason: forge }
  glab-athena:             { class: destructive, reason: forge }
  # fleet-report (DND-433) upserts this session's fleet registry rows on the
  # Athena server. Each report is an idempotent upsert, but it mutates EXTERNAL
  # state, which is this file's definition of destructive.
  fleet-report:            { class: destructive, reason: registry }
  # notion-athena-mcp launches an MCP server that EXPOSES Notion writes. It does
  # not itself write, but its worst-case capability is a tracker mutation, so it
  # is classified destructive. FLAGGED for owner ratification (DND-172); shipped
  # destructive because over-restrictive is the safe direction for C2's gating.
  notion-athena-mcp:       { class: destructive, reason: mcp }
  # test-slot (DND-485) runs an arbitrary caller-supplied CMD once a machine
  # slot is free. Its own writes are local pool state, but by worst-case
  # capability it executes whatever CMD is: classifying it lower would let a
  # phase that permits only readOnly/idempotent tools run `test-slot -- <any
  # destructive command>`. Destructive until a phase gate can classify by the
  # wrapped CMD; DND-486 (wiring into integration-gate / captain Verify) must
  # account for this.
  test-slot:               { class: destructive, reason: wrapper }

  # --- skill executables (DND-508), keyed by their path under ai/ ---
  # readOnly
  skills/athena:inbox-attend/bin/wedge-ticket-decide: { class: readOnly, reason: decide }
  skills/athena:inbox/bin/inbox-doctor:               { class: readOnly, reason: diagnose }
  skills/athena:inbox/bin/inbox-status:               { class: readOnly, reason: count }
  skills/athena:slack/bin/channels:                   { class: readOnly, reason: list }
  skills/athena:slack/bin/permalink:                  { class: readOnly, reason: query }
  skills/athena:slack/bin/read-channel:               { class: readOnly, reason: read }
  skills/athena:slack/bin/read-thread:                { class: readOnly, reason: read }
  skills/athena:slack/bin/whoami:                     { class: readOnly, reason: identity }
  skills/athena:standup/scripts/standup-window.sh:    { class: readOnly, reason: compute }
  # idempotent: local state only. inbox-wait provisions this machine's doorbell
  # files; slack read-inbox advances its own seen-state file; integration-gate
  # fetches and runs the gate (--gate), which writes ai/eval/scorecard.json like
  # harness-gate does.
  skills/athena:inbox/bin/inbox-wait:                 { class: idempotent, reason: doorbell }
  skills/athena:slack/bin/read-inbox:                 { class: idempotent, reason: state }
  skills/athena:merge-boarding/scripts/integration-gate: { class: idempotent, reason: gate }
  # destructive: Slack writes, routed mail through the Athena server, and the
  # inbox ack, which consumes messages from a view other sessions share (see the
  # "WHO MAY ACK" note in the bin).
  skills/athena:inbox/bin/read-inbox:                 { class: destructive, reason: ack }
  skills/athena:inbox/bin/send-mail:                  { class: destructive, reason: send }
  skills/athena:slack/bin/delete:                     { class: destructive, reason: slack }
  skills/athena:slack/bin/dm:                         { class: destructive, reason: slack }
  skills/athena:slack/bin/post:                       { class: destructive, reason: slack }
  skills/athena:slack/bin/react:                      { class: destructive, reason: slack }
  skills/athena:slack/bin/reply:                      { class: destructive, reason: slack }
  skills/athena:slack/bin/update:                     { class: destructive, reason: slack }
  skills/athena:slack/bin/upload:                     { class: destructive, reason: slack }
