# hyprpaper 0.8+ config.
#
# 0.8 replaced the flat syntax with `wallpaper { ... }` blocks. The old
# `preload = ...`, `wallpaper = MON, PATH` and `ipc = off` lines still parse
# without error but are ignored, leaving every monitor blank. Check a config
# with `timeout 5 hyprpaper -c <file>`: any "Monitor X has no target" line
# means that monitor gets no wallpaper.
#
# `monitor =` empty matches every monitor. Name one with its connector
# (`monitor = DP-2`) or, stabler across docks, its EDID description
# (`monitor = desc:Dell Inc. DELL P2721Q 3V9PLH3`). A block naming a monitor
# overrides the catch-all whatever the block order (verified on 0.8.4).

splash = false

# Every monitor without its own block
wallpaper {
    monitor =
    path = /home/cjpoll/Pictures/cyberpunk-main.png
    fit_mode = cover
}

# Rotated portrait monitor (transform 1); the image is 2160x3840
wallpaper {
    monitor = desc:Dell Inc. DELL P2721Q GPCZGH3
    path = /home/cjpoll/Pictures/cyberpunk-rotated.jpg
    fit_mode = cover
}
