# Hypridle Configuration
# Cyberpunk theme idle management

general {
    lock_cmd = pidof hyprlock || hyprlock       # Lock command - avoid starting multiple instances
    before_sleep_cmd = loginctl lock-session    # Lock before sleep (lid close, systemd sleep)
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn on display after sleep
    ignore_dbus_inhibit = false                 # Respect inhibitors (e.g., during video playback)
}

# Listener 1: Lock screen after 5 minutes of idle
listener {
    timeout = 300                               # 5 minutes in seconds
    on-timeout = loginctl lock-session          # Lock the session (triggers hyprlock via lock_cmd)
    # Also dpms-on here: the log shows listener1's resume fires reliably while
    # listener2's on-resume (below) intermittently does NOT — so wake DPMS from
    # the path that actually works. dpms-on is a no-op when already on.
    on-resume = hyprctl dispatch dpms on; notify-send "Welcome back!"; echo "$(date -Is) RESUME  listener1 (lock) + dpms on" >> /home/cjpoll/.local/state/hypridle.log
}

# Listener 2: Turn off monitors 10 minutes after lock (15 min total idle)
# Note: This counts from the START of idle, so 15 min total = 10 min after lock
#
# The on-timeout/on-resume lines are instrumented: they log to
# ~/.local/state/hypridle.log so a stuck-monitor recurrence is diagnosable.
# If the log shows TIMEOUT but no matching RESUME after you press keys, the
# resume event never reached hypridle (compositor idle-notify), not a dpms
# failure. SUPER+O (bindl in hyprland.conf) is the manual wake regardless.
listener {
    timeout = 900                               # 15 minutes total (5 min lock + 10 min more)
    on-timeout = hyprctl dispatch dpms off; echo "$(date -Is) TIMEOUT dpms off" >> /home/cjpoll/.local/state/hypridle.log
    on-resume = hyprctl dispatch dpms on; echo "$(date -Is) RESUME  dpms on" >> /home/cjpoll/.local/state/hypridle.log
}

# Note: No sleep listener configured per user request
# If you need to prevent system sleep entirely, configure that in systemd:
#   sudo systemctl mask sleep.target suspend.target hibernate.target hybrid-sleep.target
