# Source system-specific configuration (monitors, GPU settings, workspace bindings)
source = ~/hyprland.local.conf

exec-once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11

# Special workspaces (overlay/dropdown style)
workspace = special:bluetui, gapsin:24, gapsout:48
workspace = special:btop, gapsin:24, gapsout:48
workspace = special:yazi, gapsin:24, gapsout:48

input {
    touchpad {
        natural_scroll = true
    }
}

# General settings (Cyberpunk theme)
general {
  layout = master

  border_size = 2
  gaps_in = 2
  gaps_out = 0

  # Active window: Neon Magenta with Orange gradient
  col.active_border = rgb(ff6b35)

  # Inactive window: Dark Purple with subtle Electric Blue
  col.inactive_border = rgba(0066ff33)
}

# Master layout
master {
  mfact = 0.65          # master takes 65% of the screen
  #orientation = left   # master on the left, stack on the right
  orientation = center  # master centered, slaves split to either side
  new_status = slave    # new windows join the stack, never displace master
  new_on_top = false    # new windows append to the bottom of the stack
  drop_at_cursor = true # mouse-dragged windows land where the cursor is
}

# Window Rules
# Send all Steam games to workspace 5 (Gaming workspace)
windowrule = workspace 5 silent, match:class ^(steam_app_.*)$

# Bluetui special workspace (dropdown/overlay)
windowrule = workspace special:bluetui, match:title ^(bluetui)$
windowrule = float on, match:title ^(bluetui)$
windowrule = size 80% 80%, match:title ^(bluetui)$
windowrule = center on, match:title ^(bluetui)$

# Btop special workspace (dropdown/overlay)
windowrule = workspace special:btop, match:title ^(btop)$
windowrule = float on, match:title ^(btop)$
windowrule = size 80% 80%, match:title ^(btop)$
windowrule = center on, match:title ^(btop)$

# Yazi special workspace (dropdown/overlay)
windowrule = workspace special:yazi, match:title ^(yazi)$
windowrule = float on, match:title ^(yazi)$
windowrule = size 80% 80%, match:title ^(yazi)$
windowrule = center on, match:title ^(yazi)$

# Yazi regular floating window (for drag-and-drop)
windowrule = float on, match:title ^(yazi-float)$
windowrule = size 80% 80%, match:title ^(yazi-float)$
windowrule = center on, match:title ^(yazi-float)$

# Window decoration
decoration {
  rounding = 8

  # Blur for that cyberpunk aesthetic
  blur {
    enabled = true
    size = 6
    passes = 2
    new_optimizations = true
  }
}

# Border animation
animations {
  enabled = true

  bezier = linear, 0, 0, 1, 1
  bezier = ease, 0.25, 0.1, 0.25, 1

  animation = border, 1, 3, ease           # 300ms - snappy focus change (matches 0.2-0.3s guideline)
  animation = fade, 1, 2, ease             # 200ms - quick fade (matches 0.2-0.3s guideline)
  animation = windows, 1, 3, ease, slide   # 300ms - smooth window animations
  animation = workspaces, 1, 5, ease, slide  # 500ms - smooth workspace switching
}

# Launcher
bind = SUPER, SPACE, exec, wofi --show drun --allow-images --style /home/cjpoll/.config/hypr/wofi.css

# Emoji/Icon Picker
bind = SUPER, PERIOD, exec, /home/cjpoll/dev/custom/scripts/emoji-picker

# Applications
bind = SUPER, R, exec, /home/cjpoll/dev/browser/ruby-browser-gtk3/run
bind = SUPER, F, exec, firefox
bind = SUPER, A, exec, firefox --new-window "https://chatgpt.com"
bind = SUPER, N, exec, flatpak run org.mozilla.firefox --new-window "https://notion.so"
bind = SUPER, T, exec, alacritty
bind = SUPER, C, exec, flatpak run org.mozilla.firefox --new-window "https://claude.ai"
bind = SUPER, V, exec, alacritty -e cava
bind = SUPER, I, exec, hyprlock

# Wake displays — bindl fires even while the session is locked, so this is a
# guaranteed manual wake when hypridle's on-resume fails to turn DPMS back on.
bindl = SUPER, O, exec, hyprctl dispatch dpms on
bind = SUPER, W, exec, pkill -SIGUSR1 -f apps/bar/main.rb
bind = SUPER SHIFT, W, exec, pkill -SIGUSR2 -f apps/bar/main.rb
bind = SUPER, Z, exec, pkill -SIGUSR1 -f "ruby launcher.rb"

# Special workspace toggles (dropdown/overlay)
bind = SUPER, B, exec, /home/cjpoll/dev/custom/scripts/toggle-tui.sh --name bluetui --executable /usr/sbin/bluetui
bind = SUPER, D, exec, /home/cjpoll/dev/custom/scripts/toggle-tui.sh --name btop --executable /usr/sbin/btop
bind = SUPER, E, exec, /home/cjpoll/dev/custom/scripts/toggle-tui.sh --name yazi --executable /usr/bin/yazi
bind = SUPER SHIFT, E, exec, alacritty --title yazi-float -e /usr/bin/yazi

# Screenshots
bind = ALT SHIFT, 3, exec, hyprshot -m window --clipboard-only
bind = ALT SHIFT, 4, exec, hyprshot -m region --clipboard-only
bind = ALT SHIFT, 5, exec, hyprshot -m output --clipboard-only
bind = ALT CTRL, 3, exec, hyprshot -m window --output-folder ~/Pictures/screenshots --silent && ls -t ~/Pictures/screenshots/*.png | head -1 | wl-copy
bind = ALT CTRL, 4, exec, hyprshot -m region --output-folder ~/Pictures/screenshots --silent && ls -t ~/Pictures/screenshots/*.png | head -1 | wl-copy
bind = ALT CTRL, 5, exec, hyprshot -m output --output-folder ~/Pictures/screenshots --silent && ls -t ~/Pictures/screenshots/*.png | head -1 | wl-copy

# Volume
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, xbacklight -inc 10
bind = , XF86MonBrightnessDown, exec, xbacklight -dec 10

# Media Controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# Window Management
bind = SUPER SHIFT, T, fullscreen
bind = ALT, TAB, cyclenext,
bind = ALT, TAB, bringactivetotop,
bind = SUPER SHIFT, 1, movewindow, mon:1
bind = SUPER SHIFT, 0, movewindow, mon:0
bind = SUPER, Q, killactive

# Mouse dragging (SUPER + left drag to move, SUPER + right drag to resize)
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER CTRL, h, resizeactive, -25 0
bind = SUPER CTRL, l, resizeactive, 25 0
bind = SUPER CTRL, k, resizeactive, 0 -25
bind = SUPER CTRL, j, resizeactive, 0 25

bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6

# Touchpad gestures (4-finger swipe to switch workspaces)
gesture = 4, horizontal, workspace
gestures {
  workspace_swipe_distance = 300
  workspace_swipe_invert = true
}

# Kill stale pipewire processes before starting fresh
exec-once = pkill -9 pipewire; pkill -9 wireplumber; sleep 0.5 && gentoo-pipewire-launcher
exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = /usr/libexec/xdg-desktop-portal
exec-once = hyprpaper
exec-once = /home/cjpoll/dev/widgets/bin/bar
exec-once = /home/cjpoll/dev/widgets/bin/launcher
exec-once = hypridle
exec-once = gammastep -l 40.33:-111.9
exec-once = dunst &
