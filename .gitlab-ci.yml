# GitLab CI for custom (DND-1946). One job: the harness gate, server side,
# on every branch and MR before merge. It adds a run; it never replaces the
# local gate, the integration receipt or the push refusals.
#
# Rules this file holds (ai/test/gitlab-ci/self-test.sh asserts them):
#   - A fork MR never runs: the runner is the owner's own machine, and a fork
#     MR is arbitrary code from outside the project.
#   - No credentials: no CI/CD variables, no secrets, no id_tokens.
#   - Every job carries the role tag `ci` (never a per-host tag); the runner
#     does not take untagged jobs.

# Known state (measured 2026-10-04, DND-1946): in a default unprivileged docker
# container, 13 of 194 gate checks do not pass. bubblewrap needs unprivileged
# user namespaces (the tool-sandbox suites), `git hook list` needs a newer git
# than trixie's, and the proc-scan and process-group suites (suite-reaper,
# test-slot, telemetry-shell) read host process state. The job stays a full,
# unweakened gate: no allow_failure, no skipped check. Until the follow-up
# (make the gate pass in the CI image: a runner that allows user namespaces and
# a git with `git hook list`) lands, do not make this job a required check.

workflow:
  rules:
    # Fork guard: an MR whose source project is not this project never runs.
    - if: '$CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_PROJECT_PATH'
      when: never
    # MR pipelines.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # A branch with an open MR runs the MR pipeline only (no duplicates).
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Branch pipelines for branches with no open MR, main included.
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

harness-gate:
  stage: test
  tags: [ci]
  interruptible: true
  # Pinned by exact tag and digest: a public Docker Hub image the runner can
  # pull, Ruby 3.4 (the harness floor, DND-931) on Debian trixie. It is also
  # the FROM of dockerfiles/ci-harness/Dockerfile (the suite asserts they match).
  image: ruby:3.4.10-slim-trixie@sha256:b573616eed67613e1d380ebb777d87aa094fad7505bdbc2d1b45dca9dd9116b9
  variables:
    # Full history, so a check that reads the landed bar from origin/main can.
    GIT_DEPTH: "0"
  script:
    # The pinned tool set (DND-1998): packages at exact versions from one
    # snapshot.debian.org timestamp, git built from a sha256-checked tarball
    # (trixie's git has no `git hook list`), /usr/bin/ruby, and the non-root
    # `ci` user. The same script builds dockerfiles/ci-harness/Dockerfile.
    - dockerfiles/ci-harness/setup.sh
    # Run as `ci`, owning the tree: suites assert unreadable-path and ownership
    # behavior, and git refuses a tree owned by another user.
    - chown -R ci:ci "$CI_PROJECT_DIR" && ln -sfn "$CI_PROJECT_DIR" /home/ci/dev/custom && chown -h ci:ci /home/ci/dev/custom
    # The runner's clone may not create origin/main; the landed bars need it.
    - runuser -u ci -- env HOME=/home/ci git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
    - runuser -u ci -- env HOME=/home/ci git rev-parse --verify --quiet refs/remotes/origin/main
    - runuser -u ci -- env HOME=/home/ci ai/bin/harness-gate
